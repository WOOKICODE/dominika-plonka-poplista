<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Dominika Płonka — Poplista. Out Now." />
    <title>Dominika Płonka — Poplista</title>
  </head>
  <body>
    <main class="one-pager">
      <section class="hero" aria-label="Dominika Płonka — Poplista">
        <h1 class="sr-only">Dominika Płonka — Poplista</h1>
        <picture class="hero-picture">
          <source media="(max-width: 600px)" srcset="/dominika-plonka-mobile.webp" type="image/webp" width="737" height="992" />
          <source media="(max-width: 600px)" srcset="/dominika-plonka-mobile.png" width="737" height="992" />
          <source srcset="/dominika-plonka.webp" type="image/webp" />
          <img class="hero-photo" src="/dominika-plonka.png" alt="Dominika Płonka na jasnym tle" fetchpriority="high" decoding="async" width="1244" height="746" />
        </picture>
        <div class="release">
          <a class="record-link" href="https://www.instagram.com/plonkadominika/" target="_blank" rel="noopener noreferrer" aria-label="Poplista — zobacz na Instagramie">
            <picture><source srcset="/poplista-vinyl.webp" type="image/webp" /><img class="record" src="/poplista-vinyl.png" alt="Poplista — okładka albumu z płytą winylową" decoding="async" width="504" height="414" /></picture>
          </a>
          <nav class="release-links" aria-label="Linki Dominiki Płonki">
            <a href="https://www.instagram.com/plonkadominika/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true"></span> Sklep</a>
            <a href="https://www.instagram.com/plonkadominika/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true"></span> Trasa</a>
            <a href="https://www.instagram.com/plonkadominika/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true"></span> Instagram</a>
          </nav>
        </div>
      </section>
      <footer class="release-banner"><a href="https://www.instagram.com/plonkadominika/" target="_blank" rel="noopener noreferrer">Out Now!</a></footer>
    </main>
    <canvas id="sparkles" aria-hidden="true"></canvas>
    <div id="cursor-dot" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
